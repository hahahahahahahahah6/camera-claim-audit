[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented local device image intake"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
camera-claim-audit = "camera_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["camera_claim_audit*"]
